name: Sniff Visa Bulletin

on:
  workflow_dispatch:        # 手动触发
    inputs:
      force:
        description: '跳过时间门控，强制探测下一期一次（调试/首次运行用）'
        type: boolean
        default: false
      selftest:
        description: '抓取已发布的当前那期，校验解析器是否正确（不写文件/不开 PR）'
        type: boolean
        default: false
      rehearse:
        description: '彩排·拿已发布的某期(形如 2026-09)把整条命中链路跑一遍；只写临时副本，不改仓库'
        default: ''
      backfill:
        description: '用 Wayback 拉历史释出日分布并打印推荐窗口/核心区（仅分析，不改文件）'
        type: boolean
        default: false
      drill:
        description: '演习：发一条测试 Bark 推送验证手机能收到（需先配 BARK_KEY）'
        type: boolean
        default: false
      announce:
        description: '人工录入新一期后，推送一条正式排期更新通知（读当前快照；需 BARK_KEY）'
        type: boolean
        default: false
      # ↓ 一键人工录入：官网+档案馆全堵、只能从第三方(律所/论坛)获知数据时。
      #   只需填 bulletin+fad+dff 三个框即可触发；自动写回+开PR自动合并+部署+Bark。
      manual_bulletin:
        description: '人工录入·公告月份（形如 2026-09；填了本框即走人工录入）'
        default: ''
      manual_fad:
        description: '人工录入·表A Final Action（EB-1 中国，形如 2023-07-01 或 current）'
        default: ''
      manual_dff:
        description: '人工录入·表B Dates for Filing（形如 2023-12-01 或 current）'
        default: ''
      manual_released:
        description: '人工录入·官方发布日 YYYY-MM-DD（留空=未知，不会用今天顶替）'
        default: ''
      manual_chart:
        description: '人工录入·本月职业类递交用表'
        type: choice
        options: ['?', 'A', 'B']
        default: '?'
  schedule:
    # 覆盖美东 ~09:00–21:00（含上午盲区；含夏/冬令时）。脚本再按美东时间精确门控。
    # 注意：GitHub 定时任务不保证准点、高负载会延迟/丢弃，故时段放宽 + 多槽位以降低漏抓概率。
    - cron: '*/30 13-23 7-26 * *'   # 美东上午~晚（ET09–19 EDT ≈ UTC13–23）；覆盖安全窗 7–26 号
    - cron: '*/30 0-2 8-27 * *'     # 傍晚 ET 溢出到 UTC 次日 0–2 点（含冬令时）
    # 提速：核心日(10–20号) ET09–17（≈UTC13–21）补 :10/:20/:40/:50，与 */30 合成每 10 分钟。
    # 上界与脚本里的 CORE_DAY_HI 必须一致——只放宽一边等于没放宽:cron 决定"跑不跑",
    # 门控决定"探不探"。实测发布日含 20 号,故两边同步取 20。
    - cron: '10,20,40,50 13-21 10-20 * *'
    # 窗外稀疏哨兵（每天 ET 上午/下午各一次）：覆盖 27号–6号的空窗——极端早发/晚发，
    # 以及"上月期错过后的跨月补探"（run() 对缺失的当月期绕过门控直接补）。
    - cron: '0 14,20 1-6,27-31 * *'

# 命中后通过 PR 留存审计记录，回归校验通过后合并并显式触发 CI。
permissions:
  contents: write
  pull-requests: write
  actions: write

# 与 data-update 共用写入锁，避免两个抓取工作流同时修改 main。
concurrency:
  group: data-updates-main
  cancel-in-progress: false

# 让 checkout/setup-python 用 Node 24 运行，消除 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sniff:
    if: github.ref == 'refs/heads/main'
    # 抓取需绕开 DOS 对 Azure 机房 IP 的 403 封锁 → 可切到住宅 IP 的自建 runner。
    # 设仓库变量 RUNNER_LABEL=eb1a-fetch 即切换；删掉变量立刻回退托管 runner(逃生口)。
    # 注意:本工作流在发布窗内每 10 分钟一次,自建 runner 若长期离线会堆积排队任务
    # ——出门/关机前务必删掉该变量。配置见 docs/self-hosted-runner.md。
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 模式：drill(演习推送) / backfill(回填历史) / selftest+force(调试) / 默认(定时探测)。
      - name: Sniff / selftest / backfill / drill
        id: sniff
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          FORCE: ${{ inputs.force || false }}
          SELFTEST: ${{ inputs.selftest || false }}
          REHEARSE: ${{ inputs.rehearse }}
          DRILL: ${{ inputs.drill || false }}
          ANNOUNCE: ${{ inputs.announce || false }}
          BACKFILL: ${{ inputs.backfill || false }}
          MANUAL_BULLETIN: ${{ inputs.manual_bulletin }}
          MANUAL_FAD: ${{ inputs.manual_fad }}
          MANUAL_DFF: ${{ inputs.manual_dff }}
          MANUAL_RELEASED: ${{ inputs.manual_released }}
          MANUAL_CHART: ${{ inputs.manual_chart || '?' }}
        shell: bash
        run: |
          echo "write=false" >> "$GITHUB_OUTPUT"
          # 诊断模式优先，即使同时填写人工数据也不会提交文件或创建 PR。
          if [ "$SELFTEST" = "true" ]; then
            python scripts/sniff_visa_bulletin.py --selftest
          elif [ -n "$REHEARSE" ]; then
            python scripts/sniff_visa_bulletin.py --rehearse "$REHEARSE"
          elif [ "$DRILL" = "true" ]; then
            python scripts/sniff_visa_bulletin.py --drill
          elif [ "$ANNOUNCE" = "true" ]; then
            python scripts/sniff_visa_bulletin.py --announce
          elif [ "$BACKFILL" = "true" ]; then
            python scripts/backfill_release_dates.py
          else
            if [ -n "$MANUAL_BULLETIN" ] || [ -n "$MANUAL_FAD" ]; then
              python scripts/sniff_visa_bulletin.py --manual \
                --bulletin "$MANUAL_BULLETIN" \
                --fad "$MANUAL_FAD" \
                --dff "$MANUAL_DFF" \
                --released "$MANUAL_RELEASED" \
                --chart "$MANUAL_CHART"
            else
              args=(scripts/sniff_visa_bulletin.py)
              if [ "$FORCE" = "true" ]; then args+=(--force); fi
              python "${args[@]}"
            fi
            echo "write=true" >> "$GITHUB_OUTPUT"
          fi

      # 补判本月递交用表：FILING_CHART 仍为 '?' 时从 USCIS AOS 页确认(USCIS 常滞后公告 1-2 天)。
      # ⚠️ 只在自建 runner(住宅 IP)上跑。USCIS 对托管 runner 返 403 → 状态被写成
      # 「获取失败」→ index.html 变了 → 自动开 PR → Bark 误报「探测到新签证公告」。
      # 2026-08-22 真实发生过一次。日常由本机 cron scripts/uscis_chart_watch.sh 值守。
      - name: Resolve filing chart if pending (residential IP only; USCIS 403s hosted runners)
        if: runner.environment == 'self-hosted' && steps.sniff.outputs.write == 'true'
        run: python scripts/sniff_visa_bulletin.py --filing-chart

      - name: Validate updated bulletin data
        if: steps.sniff.outputs.write == 'true'
        run: python scripts/test_sniff.py

      # 数据若改动则开 PR；无改动时静默跳过（不建 PR）。
      - name: Open review PR if changed
        id: cpr
        if: steps.sniff.outputs.write == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          add-paths: |
            data/release_log.json
            index.html
          branch: auto/visa-bulletin-update
          delete-branch: true
          commit-message: "Auto: visa bulletin update"
          title: "🔎 探测到新签证公告（自动更新）"
          body: |
            探测器检测到新一期签证公告，已自动更新 `data/release_log.json` 与 `index.html`，
            **本 PR 将自动合并上线**（保留作审计记录）。

            数据已过理智门禁（合法日期 / 区间 / 移动幅度校验）。如发现有误：
            - 在 commit 历史回滚本次提交，或手动改回；
            - 并按需校准 `scripts/sniff_visa_bulletin.py` 的 `parse_eb1_china`。
          labels: |
            visa-bulletin
            auto-merged

      # 仅当"确实新建了复核 PR"时推送一次 Bark（避免合并前每次探测重复命中刷屏）。需配 BARK_KEY。
      # 通知正文 BARK_BODY 由上面的 sniff 步骤经 $GITHUB_ENV 传入（带具体日期+移动天数）。
      - name: Notify via Bark on new review PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python scripts/sniff_visa_bulletin.py --send-bark

      # 只合并本次校验过的 head；已有 PR 更新后也可重试合并。
      # 数据已过理智门禁；如有误可在 commit 历史回滚。合并失败则保留 PR 供手动合并。
      - name: Auto-merge the update PR
        id: merge
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.cpr.outputs.pull-request-head-sha }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          test -n "$PR_HEAD"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$PR_HEAD" \
            || { echo "::error::自动合并失败，PR 已保留，请手动合并 ${PR_URL}"; exit 1; }
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的 push 不会触发其他 push 工作流，显式启动完整校验和发布。
      - name: Run CI and publish updated main
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
