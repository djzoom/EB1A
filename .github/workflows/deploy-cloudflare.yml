name: Deploy to Cloudflare Pages

# CI 验证通过后发布同一份产物。凭据配好后设置 CLOUDFLARE_ENABLED=true。
# 自定义域名：gc.bracketboss2026.com；配置步骤见 README。
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure gctime Pages project exists
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/pages/projects'
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'}
          try:
              with urllib.request.urlopen(urllib.request.Request(base + '/gctime', headers=headers), timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              body = json.dumps({'name': 'gctime', 'production_branch': 'main'}).encode()
              with urllib.request.urlopen(urllib.request.Request(base, data=body, headers=headers), timeout=30) as response:
                  result = json.load(response)
          if not result.get('success'):
              raise SystemExit('Cloudflare project setup failed')
          print('Pages project ready:', result['result']['name'])
          PY
      - name: Deploy verified artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy _site --project-name=gctime --branch=main --commit-hash=${{ github.sha }}
