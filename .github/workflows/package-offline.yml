name: Package Offline Build

on:
  workflow_call:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline
          path: dist
      - name: Publish verified offline build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-latest
          name: 离线版（最新快照）
          body: |
            EB-1～EB-5 多国家排期推演；解压后用浏览器打开 EB1A.html。

            已通过解析器回归与浏览器检查。构建提交：${{ github.sha }}
            离线文件为数据快照，不会自动同步未来公告。
          files: dist/EB1A-offline.zip
          fail_on_unmatched_files: true
